<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{font:14px -apple-system,sans-serif;line-height:1.6;padding:18px}h1{font-size:24px}li{margin:8px 0}</style><h1>Safari 收藏夹同步 V0.9</h1><p>预览版本 __VERSION__，适用于 Apple Silicon、macOS 13 或更高版本。</p><p>应用将安装到：</p><p><b>/Applications/Safari 收藏夹同步.app</b></p><ul><li>可选 Edge → Safari 或 Safari → Edge。</li><li>两个方向均支持增量与纯镜像。</li><li>每次同步前完整备份两个浏览器。</li><li>支持中英文界面及菜单栏快捷面板。</li></ul><p>安装前请退出旧版。安装不会执行同步，也不会改变已有备份。此为本机制作的预览安装包，未经 Developer ID 签名和 Apple 公证。</p></html>
