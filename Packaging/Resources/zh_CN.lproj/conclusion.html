<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{font:14px -apple-system,sans-serif;line-height:1.6;padding:18px}h1{font-size:24px}li{margin:10px 0}</style><h1>V0.9 已准备就绪</h1><ol><li>从“应用程序”打开 Safari 收藏夹同步。</li><li>在“设置”选择书签文件并检查访问。若系统拒绝，点击“打开完全磁盘访问设置”，添加安装后的 App。</li><li>选择同步方向和模式，先备份，再核对首次同步结果。</li></ol><p>关闭主窗口后，可从顶部菜单栏循环箭头打开快捷面板。若 Bartender 隐藏了图标，请将本应用设为“显示”；也可通过 Dock 右键菜单 → 打开快捷面板。</p><p>在“设置 → 通用 → 语言”选择跟随系统、English 或简体中文，重新打开应用后生效。</p><p>V0.9 为预览版本。软件不会上传收藏夹和备份。</p></html>
